name: Windows build

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the release binary on Windows
        run: cargo check --release --locked --features proxy --bin llmshim
