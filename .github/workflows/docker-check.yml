name: Docker image

# The Dockerfile builds the workspace, so any new workspace member, toolchain
# requirement or glibc mismatch breaks it silently unless it is built here.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - .github/workflows/docker-check.yml
      - .github/workflows/images.yml

permissions:
  contents: read

jobs:
  docker-check:
    runs-on: ubuntu-latest
    # Three builds of the whole tree (no dependency layer is cached), one with the
    # AWS SDK: a hang should cost an hour, not the default six.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --tag llmshim-ci .
      - name: Start it and probe /health
        run: |
          # No --rm: a binary that dies at exec (a glibc mismatch, say) must
          # leave its container behind so the log below can still be read.
          id=$(docker run -d -e OPENAI_API_KEY=ci-not-a-real-key \
            -e LLMSHIM_CATALOG_OFFLINE=1 -p 3000:3000 llmshim-ci proxy)
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              docker rm -f "$id" >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs "$id"
          docker rm -f "$id" >/dev/null || true
          exit 1
      - name: The published feature set builds and prints its schema
        run: |
          # The release workflow (images.yml, note 0019) builds this feature set;
          # a release must not be the first time it meets the distroless runtime.
          docker build --build-arg FEATURES=serve-redis,serve-otel --tag llmshim-ci-serve .
          # Captured, not piped: a pipe would report the exit status of the last
          # command and hide a binary that dies at exec.
          schema=$(docker run --rm llmshim-ci-serve serve --print-schema)
          grep -q '"properties"' <<<"$schema"
      - name: The cloud transports build into the image too, and what they cost
        run: |
          # Not the published feature set (0019): the combination a deployment on
          # AWS, Google Cloud or Azure builds (0020). It must not rot, and the two
          # sizes are what the decision to publish it rests on.
          docker build --build-arg FEATURES=serve-redis,serve-otel,serve-cloud --tag llmshim-ci-cloud .
          schema=$(docker run --rm llmshim-ci-cloud serve --print-schema)
          grep -q '"properties"' <<<"$schema"
          {
            echo "### Image size"
            echo "| features | size |"
            echo "| --- | --- |"
            echo "| serve-redis,serve-otel | $(docker image ls llmshim-ci-serve --format '{{.Size}}') |"
            echo "| serve-redis,serve-otel,serve-cloud | $(docker image ls llmshim-ci-cloud --format '{{.Size}}') |"
          } >> "$GITHUB_STEP_SUMMARY"
