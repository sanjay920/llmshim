name: Docker image

# The Dockerfile builds the workspace, so any new workspace member, toolchain
# requirement or glibc mismatch breaks it silently unless it is built here.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - .github/workflows/docker-check.yml

permissions:
  contents: read

jobs:
  docker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --tag llmshim-ci .
      - name: Start it and probe /health
        run: |
          id=$(docker run -d --rm -e OPENAI_API_KEY=ci-not-a-real-key \
            -e LLMSHIM_CATALOG_OFFLINE=1 -p 3000:3000 llmshim-ci proxy)
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              docker stop "$id" >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs "$id"
          docker stop "$id" >/dev/null || true
          exit 1
