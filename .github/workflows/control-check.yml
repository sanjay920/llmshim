name: Control plane

# `llmshim-control` (design note 0024) is a separate, unpublished crate with its own
# workspace and lockfile, so the database and its C library never enter the root crate's
# dependency graph. This keeps it formatted, warning-free and tested on each pull request,
# on main and weekly, and proves the root lockfile stays free of it.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '53 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  control-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: The root lockfile has no database in it
        run: |
          if grep -q 'name = "rusqlite"' Cargo.lock; then
            echo "rusqlite is in the root Cargo.lock: the control plane's dependencies leaked into the root crate" >&2
            exit 1
          fi
      - name: Format
        working-directory: crates/llmshim-control
        run: cargo fmt --check
      - name: Clippy
        working-directory: crates/llmshim-control
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        working-directory: crates/llmshim-control
        env:
          LLMSHIM_CATALOG_OFFLINE: '1'
        run: cargo test --locked
