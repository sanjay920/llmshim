name: Serve feature

# The `serve` feature is off by default and in development, so the release
# gate does not build it. This keeps it compiling and tested on every PR.
on:
  pull_request:

permissions:
  contents: read

jobs:
  serve-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --locked --all-targets --features serve -- -D warnings
      - name: Tests
        env:
          LLMSHIM_CATALOG_OFFLINE: '1'
        run: |
          cargo test --locked --features serve --lib serve::
          cargo test --locked --features serve --test unit_serve_cli
          cargo test --locked --features serve --test integration_serve
          cargo test --locked --features serve --test integration_serve_tls
          cargo test --locked --features serve --bin llmshim serve_tls

  serve-redis-check:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --locked --all-targets --features serve-redis -- -D warnings
      - name: Fleet tests against a real Redis
        env:
          LLMSHIM_CATALOG_OFFLINE: '1'
          LLMSHIM_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          cargo test --locked --features serve-redis --lib serve::
          cargo test --locked --features serve-redis --test integration_serve
          cargo test --locked --features serve-redis --test integration_serve_fleet -- --ignored
