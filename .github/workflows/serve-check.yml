name: Serve feature

# The `serve` feature is off by default and in development, so the release
# gate does not build it. This keeps it compiling, and every one of its tests
# running, on each pull request, on main and weekly. A hand-kept list of test
# files once left `integration_serve_reload` running nowhere; `--tests` cannot.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # See ci.yml: only a pull request's superseded run is cancelled; each merge
  # to main keeps its own run.
  group: serve-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  serve-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --locked --all-targets --features serve -- -D warnings
      - name: Tests
        env:
          LLMSHIM_CATALOG_OFFLINE: '1'
        run: |
          cargo test --locked --features serve --tests
          # The declared-but-empty serve-otel feature must keep compiling and
          # keep refusing a [telemetry] table (0016).
          cargo clippy --locked --all-targets --features serve-otel -- -D warnings
          cargo test --locked --features serve-otel --test unit_serve_cli
          cargo test --locked --features serve-otel --test integration_serve_otel
          cargo test --locked --features serve-otel --lib serve::

  # The cloud transports built into `serve` (0020): the AWS SDK, the Google and
  # Azure paths and the configuration kinds that name them. Without this job the
  # `serve-cloud` combination would compile nowhere in CI.
  serve-cloud-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --locked --all-targets --features serve-cloud -- -D warnings
      - name: Tests (every one, so the process tests and the exit codes run)
        env:
          LLMSHIM_CATALOG_OFFLINE: '1'
        run: cargo test --locked --features serve-cloud --tests

  serve-redis-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --locked --all-targets --features serve-redis -- -D warnings
      - name: Tests, and the fleet tests against a real Redis
        env:
          LLMSHIM_CATALOG_OFFLINE: '1'
          LLMSHIM_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          cargo test --locked --features serve-redis --tests
          cargo test --locked --features serve-redis --test integration_serve_fleet -- --ignored
          # One at a time: an abandoned replica leaves a lease the others would sweep.
          cargo test --locked --features serve-redis --test integration_serve_outage -- --ignored --test-threads=1
          cargo test --locked --features serve-redis --test integration_serve_tenant_budgets -- --ignored --test-threads=1

  # The media object store (0050) against a server that really verifies SigV4. The image is
  # Bitnami's MinIO from its legacy repository (the official image is not on Docker Hub); it is
  # pinned so a moved tag cannot change what is tested.
  serve-s3-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r3
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
          MINIO_DEFAULT_BUCKETS: media
        options: >-
          --health-cmd "curl -fs http://localhost:9000/minio/health/ready"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The store against MinIO
        env:
          LLMSHIM_CATALOG_OFFLINE: '1'
          LLMSHIM_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          LLMSHIM_TEST_S3_BUCKET: media
          LLMSHIM_TEST_S3_KEY_ID: minioadmin
          LLMSHIM_TEST_S3_SECRET: minioadmin123
        run: |
          set -o pipefail
          cargo test --locked --features serve --test integration_serve_media_store -- --ignored a_real_s3 2>&1 | tee s3.log
          # A filter that matches nothing would pass with zero tests.
          grep -q "1 passed" s3.log

  # The GCS backend (0050) against fake-gcs-server, an implementation of the JSON API that is not
  # ours. Started with docker run because a service container cannot be given its arguments.
  serve-gcs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Start the emulator
        run: |
          docker run -d --name gcs -p 4443:4443 fsouza/fake-gcs-server:1.52.2 \
            -scheme http -port 4443 -backend memory
          for i in $(seq 1 30); do
            curl -fs "http://127.0.0.1:4443/storage/v1/b?project=t" >/dev/null && exit 0
            sleep 1
          done
          docker logs gcs
          exit 1
      - name: The store against the emulator
        env:
          LLMSHIM_CATALOG_OFFLINE: '1'
          LLMSHIM_TEST_GCS_ENDPOINT: http://127.0.0.1:4443
          LLMSHIM_TEST_GCS_BUCKET: media
        run: |
          set -o pipefail
          cargo test --locked --features serve --test integration_serve_media_store -- --ignored a_real_gcs 2>&1 | tee gcs.log
          # A filter that matches nothing would pass with zero tests.
          grep -q "1 passed" gcs.log

  # The Azure Blob backend (0050) against Azurite, Microsoft's storage emulator: a server that verifies
  # the Shared Key signature, which a mock cannot. Started with docker run for its arguments.
  serve-azure-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Start the emulator
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.35.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          for i in $(seq 1 30); do
            curl -s -o /dev/null "http://127.0.0.1:10000/devstoreaccount1" && exit 0
            sleep 1
          done
          docker logs azurite
          exit 1
      - name: The store against the emulator
        env:
          LLMSHIM_CATALOG_OFFLINE: '1'
          LLMSHIM_TEST_AZURE_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1
          LLMSHIM_TEST_AZURE_ACCOUNT: devstoreaccount1
          # The emulator's published development key, not a secret.
          LLMSHIM_TEST_AZURE_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
        run: |
          set -o pipefail
          cargo test --locked --features serve --test integration_serve_media_store -- --ignored a_real_azure 2>&1 | tee azure.log
          # A filter that matches nothing would pass with zero tests.
          grep -q "1 passed" azure.log
