name: Image

# Publishes a signed image with an SPDX SBOM on a release tag (note 0019).
#
# OFF until the repository owner sets the repository variable PUBLISH_IMAGE to
# "true": without it a tag builds and publishes nothing. Signing is keyless (the
# run's OIDC identity), so there is no key or registry credential to store.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    if: ${{ vars.PUBLISH_IMAGE == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: The tag must be this version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} is not v${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          # GHCR names are lower case.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            FEATURES=serve-redis,serve-otel
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          # The SBOM is attached below as a signed attestation of our own.
          provenance: false
          sbom: false

      - uses: sigstore/cosign-installer@v3

      - name: Sign the digest (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: SPDX SBOM from the pushed image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

      - name: Attach the SBOM as a signed attestation
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Verify what was just published
        run: |
          identity="^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/images\.yml@refs/tags/v"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify "${IMAGE}@${{ steps.build.outputs.digest }}" \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer"
          cosign verify-attestation --type spdxjson "${IMAGE}@${{ steps.build.outputs.digest }}" \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer" > /dev/null
