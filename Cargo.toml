[package]
name = "llmshim"
version = "0.27.2"
edition = "2021"
description = "Blazing fast LLM API translation layer in pure Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sanjay920/llmshim"
homepage = "https://github.com/sanjay920/llmshim"
keywords = ["llm", "openai", "anthropic", "gemini", "ai"]
categories = ["api-bindings", "web-programming"]
exclude = ["clients/", "api/", ".claude/", "private/", "CLAUDE.md", "Dockerfile", ".dockerignore", "gateway-test-ui.html"]

[features]
default = ["signature-introspection"]
signature-introspection = []
proxy = ["dep:axum", "dep:axum-server", "dep:hyper-util", "dep:rcgen", "dep:rustls", "dep:subtle", "dep:tower", "dep:tower-http", "dep:async-stream", "dep:async-trait"]
# Experimental priority-queue gateway. Reuses the proxy's RateLimiter/Backpressure.
gateway = ["proxy"]
# Gateway + Redis-backed distributed queue & response bus (cross-instance fleet).
gateway-redis = ["gateway", "redis-coordination"]
# Opt-in distributed rate-limit coordination via Redis. Keeps the default proxy
# binary lean — redis is only pulled in when this feature is explicitly enabled.
redis-coordination = ["proxy", "dep:redis"]

# Cloud transport dependencies are opt-in for library consumers and bundled binaries.
bedrock = [
    "dep:aws-config", "dep:aws-credential-types", "dep:aws-sigv4",
    "dep:aws-smithy-eventstream", "dep:aws-smithy-types", "dep:aws-types",
    "dep:aws-runtime", "dep:aws-smithy-runtime", "dep:aws-smithy-runtime-api",
    "dep:aws-smithy-async", "dep:aws-smithy-http-client", "dep:crc32fast",
]

vertex = ["dep:ring"]
azure = []

[dependencies]
llmshim-catalog = { version = "0.3.4", path = "crates/llmshim-catalog" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls", "http2", "gzip", "brotli", "zstd", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ring = { version = "0.17", optional = true }
uuid = { version = "1", features = ["v4"] }
jsonschema = { version = "0.46", default-features = false }
futures = "0.3"
thiserror = "2"
bytes = "1"
http = "1"
tokio-stream = "0.1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
toml = "0.8"
dirs = "6"
base64 = "0.22"
tempfile = "3"
fs2 = "0.4"

# Proxy dependencies (feature-gated)
axum = { version = "0.8", features = ["json"], optional = true }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"], optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"], optional = true }
rcgen = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
subtle = { version = "2", optional = true }
tower = { version = "0.5", features = ["limit", "util"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
async-stream = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }

# Distributed rate-limit coordination (feature: redis-coordination, opt-in)
redis = { version = "1", default-features = false, features = ["tokio-rustls-comp", "connection-manager", "script"], optional = true }
aws-config = { version = "1.12.0", default-features = false, optional = true, features = [
    "rt-tokio", "credentials-process", "sso",
] }
aws-credential-types = { version = "1.3.0", optional = true }
aws-sigv4 = { version = "1.6.0", optional = true }
aws-smithy-eventstream = { version = "0.61.4", optional = true }
aws-smithy-types = { version = "1.8.1", optional = true }
aws-types = { version = "1.6.0", optional = true }
aws-runtime = { version = "1.10.0", optional = true }
crc32fast = { version = "1.5.0", optional = true }

aws-smithy-http-client = { version = "1.5.0", default-features = false, features = [
    "rustls-ring", "rt-tokio",
], optional = true }
aws-smithy-runtime = { version = "1.16.0", features = ["client"], optional = true }
aws-smithy-runtime-api = { version = "1.19.0", features = ["client"], optional = true }
aws-smithy-async = { version = "1.3.0", features = ["rt-tokio"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
eventsource-stream = "0.2"
syn = { version = "2", features = ["full", "visit"] }
tokio-test = "0.4"
mockito = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[bin]]
name = "llmshim"
path = "src/main.rs"

[[example]]
name = "chat"
path = "examples/chat.rs"

[[example]]
name = "stream"
path = "examples/stream.rs"

[[example]]
name = "bench"
path = "benchmarks/bench.rs"

[[example]]
name = "catalog_startup"
path = "benchmarks/catalog_startup.rs"

[[example]]
name = "loadtest"
path = "benchmarks/loadtest.rs"
required-features = ["proxy"]

[[example]]
name = "gateway_loadtest"
path = "benchmarks/gateway_loadtest.rs"
required-features = ["gateway"]

[workspace]
members = ["crates/llmshim-catalog"]
exclude = ["clients/python"]
resolver = "2"
