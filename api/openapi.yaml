openapi: 3.1.0
info:
  title: llmshim API
  version: 0.7.1
  description: |
    Multi-provider LLM API proxy. Send requests in a single format,
    llmshim translates to the native API of whichever provider you choose.

    Supports OpenAI, ChatGPT subscriptions, Anthropic, Google Gemini, xAI, OpenRouter (an
    OpenAI-compatible aggregator), and self-hosted vLLM / SGLang servers.
    Provider is detected from the model prefix; ChatGPT/OpenRouter/vLLM/SGLang are
    addressed explicitly (e.g. `chatgpt/gpt-6-astra`, `openrouter/anthropic/claude-sonnet-5`,
    `vllm/<served-model>`, `sglang/<served-model>`).

    ## Gateway (experimental)

    `llmshim gateway` serves this same contract (`/v1/chat`, `/v1/chat/stream`,
    `/v1/models`, `/health`) but routes every request through a priority queue
    (in-memory or Redis-distributed). It adds request headers and operational
    endpoints:

    - `Authorization: Bearer <key>` — required when a key file is configured;
      the caller's tier/tenant come from the key (401 on missing/invalid).
    - `x-llmshim-priority: <uint>` — priority tier (honored only in open/dev
      mode; ignored when auth is enforced).
    - `Idempotency-Key: <string>` — a repeat returns the first response
      (`idempotency-replayed: true`) instead of making a second call.
    - `x-request-id` — echoed on every response for correlation.
    - `GET /metrics` (Prometheus), `GET /ready` (readiness), and
      `GET /v1/gateway/stats` (queue depths, dead-letter counts).
  license:
    name: MIT OR Apache-2.0

servers:
  - url: http://localhost:3000
    description: Local development

paths:
  /v1/chat/completions:
    post:
      operationId: nativeChatCompletions
      summary: OpenAI Chat Completions compatibility endpoint
      description: Uses the shared engine and admission path; n must be 1. Stream responses use OpenAI chunks and DONE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeChatRequest'
      responses:
        '200':
          description: Native Chat Completions JSON or SSE
          content:
            application/json:
              schema: {type: object}
            text/event-stream:
              schema: {type: string}
        default:
          description: Native error with preserved HTTP status and Retry-After when applicable
  /v1/messages:
    post:
      operationId: nativeMessages
      summary: Anthropic Messages compatibility endpoint
      description: Accepts custom function tools. Uses the shared engine and admission path. The gateway accepts x-api-key authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeMessagesRequest'
      responses:
        '200':
          description: Native Messages JSON or SSE
          content:
            application/json:
              schema: {type: object}
            text/event-stream:
              schema: {type: string}
        default:
          description: Native error with preserved HTTP status and Retry-After when applicable
  /v1/chat:
    post:
      operationId: chat
      summary: Send a chat completion request
      description: |
        Non-streaming by default. Set `stream: true` to receive SSE events
        (same format as POST /v1/chat/stream).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Chat completion response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Bad request (missing model, unknown provider)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            Rate limited by the proxy or upstream provider. Proactive proxy
            rejections include Retry-After.
          headers:
            Retry-After:
              description: Suggested delay in whole seconds when supplied by the proxy.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            Proxy capacity is exhausted or the upstream provider is unavailable.
            Proxy overload rejections include Retry-After.
          headers:
            Retry-After:
              description: Suggested delay in whole seconds when supplied by the proxy.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/chat/stream:
    post:
      operationId: chatStream
      summary: Send a streaming chat completion request
      description: |
        Always returns SSE events. Each event has a typed `event:` field
        (content, reasoning, tool_call, usage, done, error).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '429':
          description: |
            Request rate limited before the SSE response begins. Proactive
            proxy rejections include Retry-After.
          headers:
            Retry-After:
              description: Suggested delay in whole seconds.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            Proxy capacity is exhausted or the upstream provider is unavailable
            before the SSE response begins. Proxy overload rejections include
            Retry-After.
          headers:
            Retry-After:
              description: Suggested delay in whole seconds.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/models:
    get:
      operationId: listModels
      summary: List available models
      description: Returns models filtered to providers with configured API keys.
      responses:
        '200':
          description: List of available models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsResponse'

  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    NativeChatRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      properties:
        model: {type: string}
        messages:
          type: array
          items: {type: object}
        stream: {type: boolean, default: false}
        n: {type: integer, enum: [1]}
    NativeMessagesRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      properties:
        model: {type: string}
        max_tokens: {type: integer, minimum: 1}
        system:
          oneOf:
            - {type: string}
            - {type: array, items: {type: object}}
        messages:
          type: array
          items: {type: object}
        stream: {type: boolean, default: false}
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: |
            Model identifier. Use "provider/model" format (e.g., "anthropic/claude-sonnet-5")
            or just the model name for auto-detection (e.g., "claude-sonnet-5").
          examples:
            - anthropic/claude-sonnet-5
            - gpt-5.6-sol
            - gemini-3.8-flash
        messages:
          type: array
          description: Conversation messages
          items:
            $ref: '#/components/schemas/Message'
        stream:
          type: boolean
          default: false
          description: If true on /v1/chat, returns SSE stream instead of JSON.
        config:
          $ref: '#/components/schemas/Config'
        provider_config:
          type: object
          additionalProperties: true
          description: |
            Raw provider-specific JSON merged into the underlying request at the
            top level. Native/provider-only controls must be namespaced under
            `x-openai` / `x-chatgpt` / `x-anthropic` / `x-gemini` (native controls) or
            `x-openrouter` / `x-vllm` / `x-sglang` (aggregator / self-hosted
            controls). Also carries `tools`, `response_format`, and
            `reasoning_summary`.
          examples:
            - x-anthropic:
                thinking:
                  type: adaptive
                output_config:
                  effort: high
            - x-openrouter:
                provider:
                  sort: throughput
            - tools:
                - type: function
                  function:
                    name: get_weather
                    parameters:
                      type: object
        fallback:
          type: array
          items:
            type: string
          description: |
            Ordered list of fallback model IDs. If the primary model fails with a
            retryable error (429, 500, 502, 503, 529), tries the next model in the list.
            The fallback layer retries eligible failures with exponential
            backoff before moving to the next model. Fallback applies only to
            non-streaming requests; streaming endpoints ignore this field.
          examples:
            - ["openai/gpt-5.6-sol", "gemini/gemini-3.8-flash"]
        x-cache:
          $ref: '#/components/schemas/CachePolicy'
        x-shim:
          $ref: '#/components/schemas/ShimConfig'
        response_format:
          type: object
          required: [type]
          allOf:
            - if:
                properties:
                  type: {const: json_schema}
              then:
                required: [json_schema]
          properties:
            type:
              type: string
              enum: [json_schema, json_object]
            json_schema:
              type: object
              required: [schema]
              properties:
                name:
                  type: string
                schema: {}
                strict:
                  type: boolean
                  default: true

    ShimConfig:
      type: object
      additionalProperties: false
      properties:
        structured_output:
          type: string
          enum: [auto, native, forced_tool, prompt]
          default: auto
        tool_calling:
          type: string
          enum: [auto, native, prompt]
          default: auto
        reasoning_capture:
          type: string
          enum: [off, forced_tool]
          default: off

    CachePolicy:
      type: object
      properties:
        key:
          type: string
          description: Explicit Responses prompt-cache affinity key
        segments:
          type: array
          items:
            type: object
            required: [upto_message, stability]
            properties:
              upto_message:
                type: integer
                minimum: 0
              label:
                type: string
              stability:
                type: string
                enum: [static, session, turn]

    Message:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool, developer]
        content:
          description: Text content or array of content blocks
          oneOf:
            - type: string
            - type: array
              items:
                type: object
            - type: 'null'
        tool_call_id:
          type: string
          description: For tool role messages, the ID of the tool call being responded to
        tool_calls:
          type: array
          description: Tool calls made by the assistant
          items:
            $ref: '#/components/schemas/ToolCall'
        reasoning_content:
          type: string
          deprecated: true
          description: Legacy input. Reasoning without provenance is dropped.
        reasoning:
          type: array
          items:
            $ref: '#/components/schemas/ReasoningBlock'

    Config:
      type: object
      description: Provider-agnostic configuration
      properties:
        max_tokens:
          type: integer
          description: Maximum output tokens
        temperature:
          type: number
          format: double
          minimum: 0
          maximum: 2
        top_p:
          type: number
          format: double
        top_k:
          type: integer
        stop:
          type: array
          items:
            type: string
        reasoning_effort:
          type: string
          enum: [none, low, medium, high, xhigh, max]
          description: |
            Unified reasoning/thinking depth across all providers. llmshim maps
            each value to the target provider/model's native control, clamping
            to the nearest supported tier where a model lacks one (e.g. "max"
            is native only on OpenAI gpt-5.6; Gemini tops out at its "high"
            thinking level). "none" disables thinking where the model allows it.
            Full per-provider mapping tables: docs/src/guides/reasoning.md. To bypass the
            mapping and speak a provider's native dialect verbatim, use
            provider_config (x-openai.reasoning, x-anthropic.thinking,
            x-gemini.thinkingConfig) instead.
        reasoning_mode:
          type: string
          enum: [standard, pro]
          description: |
            Unified reasoning mode. "pro" requests substantially more model
            work: native reasoning.mode on OpenAI gpt-5.6 and -pro models,
            emulated as a one-tier effort bump on all other models/providers.
            Default standard.

    ChatResponse:
      type: object
      required: [id, model, provider, message, usage, latency_ms]
      properties:
        finish_reason: {type: string}
        x-llmshim-served-model:
          type: string
          description: Best-effort signature observation; never changes message provenance.
        id:
          type: string
          description: Response ID from the provider
        model:
          type: string
        provider:
          type: string
          description: Which provider handled the request
        message:
          $ref: '#/components/schemas/ResponseMessage'
        reasoning:
          type: string
          nullable: true
          description: Reasoning/thinking content if the model produced it
        usage:
          $ref: '#/components/schemas/Usage'
        latency_ms:
          type: integer
          description: End-to-end latency in milliseconds

    ResponseMessage:
      type: object
      required: [role, content]
      properties:
        refusal:
          type: string
          description: Provider refusal; no schema repair is attempted.
        reasoning:
          type: array
          items:
            $ref: '#/components/schemas/ReasoningBlock'
        role:
          type: string
        content:
          description: Text content or null
          oneOf:
            - type: string
            - type: 'null'
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'

    ToolCall:
      type: object
      properties:
        wire_ids:
          type: array
          items:
            $ref: '#/components/schemas/WireToolId'
        thought_signature:
          type: object
          required: [data, origin]
          properties:
            data:
              type: string
            origin:
              $ref: '#/components/schemas/ReasoningOrigin'
        id:
          type: string
        type:
          type: string
          enum: [function]
        function:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: string
              description: JSON-encoded arguments

    WireToolId:
      type: object
      required: [provider, wire, scope, part_id, id]
      properties:
        provider:
          type: string
        wire:
          type: string
          enum: [anthropic-messages, openai-responses, openai-chat, google-generate-content]
        scope:
          type: string
        part_id:
          type: string
        id:
          type: [string, 'null']
          description: Native correlation id; null preserves its original absence
        item_id:
          type: string
          description: Responses item id, distinct from its call_id
        signature_field:
          type: string
          description: Original wire container for a tool signature

    ReasoningOrigin:
      type: object
      required: [provider, model, family, wire, received_at]
      properties:
        provider:
          type: string
        model:
          type: string
        family:
          type: [string, 'null']
          description: Unknown families never authorize replay
        wire:
          type: string
          enum: [anthropic-messages, openai-responses, openai-chat, google-generate-content]
        received_at:
          type: string
          format: date-time
        account:
          type: string
          description: Non-secret issuer binding for encrypted replay

    ReasoningBlock:
      type: object
      required: [kind, origin]
      properties:
        kind:
          type: string
          enum: [text, redacted, encrypted]
        text:
          type: string
        data:
          type: string
          description: Opaque data; preserve verbatim
        signature:
          type: string
        item_id:
          type: string
        origin:
          $ref: '#/components/schemas/ReasoningOrigin'
        payload:
          description: Original structured reasoning item, preserved for replay
        source_field:
          type: string
        index:
          type: [integer, string]
          description: Streaming delta part index; omit from stored blocks
        replace:
          type: boolean
          description: Streaming snapshot replaces the assembled part

    Usage:
      type: object
      properties:
        cache_read_tokens:
          type: integer
          description: Input tokens served from a provider cache (zero when not reported)
        cache_write_tokens:
          type: integer
          description: Input tokens written to a provider cache (zero when not reported)
        cost_usd:
          type: [number, 'null']
          description: >-
            USD charged for this response, from the catalog's per-million-token
            prices. `null` means the catalog carries no price for the model —
            it never means free.
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        reasoning_tokens:
          type: integer
          description: Reasoning/thinking tokens used (if applicable)
        total_tokens:
          type: integer

    StreamEvent:
      description: |
        SSE events emitted during streaming. Each event has a typed `event:` field.
      oneOf:
        - type: object
          properties:
            type:
              type: string
              const: content
            text:
              type: string
        - type: object
          properties:
            type:
              type: string
              const: reasoning
            blocks:
              type: array
              items:
                $ref: '#/components/schemas/ReasoningBlock'
            text:
              type: string
        - type: object
          properties:
            type:
              type: string
              const: tool_call
            wire_ids:
              type: array
              items:
                $ref: '#/components/schemas/WireToolId'
            thought_signature:
              type: object
              required: [data, origin]
              properties:
                data:
                  type: string
                origin:
                  $ref: '#/components/schemas/ReasoningOrigin'
            id:
              type: string
            name:
              type: string
            arguments:
              type: string
        - type: object
          properties:
            type:
              type: string
              const: usage
            cache_read_tokens:
              type: integer
            cache_write_tokens:
              type: integer
            cost_usd:
              type: [number, 'null']
              description: USD charged; `null` when the model has no catalog price
            input_tokens:
              type: integer
            output_tokens:
              type: integer
            reasoning_tokens:
              type: integer
            total_tokens:
              type: integer
        - type: object
          properties:
            type:
              type: string
              const: done
            finish_reason:
              type: string
            x-llmshim-served-model:
              type: string
        - type: object
          properties:
            type:
              type: string
              const: error
            message:
              type: string
              description: Human-readable message with internal display prefixes removed
            error:
              type: object
              description: Optional source error metadata
              properties:
                message: {type: string}
                type: {type: string}
                code: {}
                param: {}
                status: {type: integer}

    ModelsResponse:
      description: >-
        Served to two audiences from one body. An OpenAI SDK reads `object` +
        `data` (so `client.models.list()` works unmodified); llmshim's own
        clients read `models`. Both audiences issue the same `GET /v1/models`,
        so the shapes are unioned rather than split across routes.
      type: object
      required: [object, data, models]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            type: object
            required: [id, object, created, owned_by]
            properties:
              id:
                type: string
                description: Routing id, accepted back as `model` on a request
              object:
                type: string
                const: model
              created:
                type: integer
                description: Release date as a Unix timestamp, or 0 when unknown
              owned_by:
                type: string
                description: Provider key serving the model
        models:
          type: array
          items:
            type: object
            required: [id, provider, name]
            properties:
              id:
                type: string
                description: Full model identifier (provider/name)
              provider:
                type: string
              name:
                type: string
                description: Model name without provider prefix

    HealthResponse:
      type: object
      required: [status, providers]
      properties:
        status:
          type: string
        providers:
          type: array
          items:
            type: string
          description: List of configured providers

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
