[book]
title = "llmshim"
authors = ["llmshim contributors"]
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "book"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/sanjay920/llmshim"
edit-url-template = "https://github.com/sanjay920/llmshim/edit/docs/concepts-site/docs/{path}"
site-url = "/llmshim/"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

