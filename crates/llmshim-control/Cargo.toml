[package]
name = "llmshim-control"
version = "0.1.0"
edition = "2021"
description = "The llmshim control plane: organizations, teams, projects, key lifecycle and signed policy snapshots (design note 0024)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sanjay920/llmshim"
# Never published (0013): a published crate cannot depend on an unpublished one, and the
# control plane depends on the `serve` module of the root crate, which is unstable.
publish = false

[dependencies]
llmshim = { path = "../..", features = ["serve"] }
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = "0.19"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
ring = "0.17"
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }

[dev-dependencies]
async-trait = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }

# Its own workspace and lockfile, so the database and its C library never enter the root
# crate's dependency graph or its lockfile: default, proxy, gateway and serve builds do not
# change (working rule 1).
[workspace]

[[bin]]
name = "llmshim-control"
path = "src/main.rs"
