openapi: 3.1.0
info:
  title: llmshim control plane
  version: 0.1.0
  description: |
    The control plane's API (design note 0026): organizations, teams, projects, key lifecycle
    and signed policy snapshots. Every route needs `Authorization: Bearer <token>`. A secret
    appears only in the answers to key creation and rotation.

    Without `--sso-config` the bearer is the one shared token, every holder is an admin, and the
    actor recorded in the change history is the `x-llmshim-actor` header (a label the caller
    asserts). With it (design note 0049) the bearer is an OIDC access token from the configured
    issuer (or, while `break_glass` is on, the shared token, as the actor `break-glass`); the actor
    is `oidc:<sub>` of the verified token, `x-llmshim-actor` is discarded, and the token's `roles`
    claim decides what the caller may do: `control:read` (every GET), `control:key-issuer` (and key
    create, revoke, rotate and limits) or `control:admin` (everything, including organizations,
    teams, projects, team budgets and publishing a snapshot). A token with none of them is refused
    with 403 everywhere.
servers:
  - url: http://127.0.0.1:3100
security:
  - bearer: []
paths:
  /v1/whoami:
    get:
      operationId: whoami
      description: The caller's actor, role and how it authenticated (`oidc`, `break_glass` or `shared_token`). Any authenticated caller may use it, including a token with no role (`role` is then null).
      responses:
        '200':
          description: The identity
          content:
            application/json:
              schema:
                type: object
                required: [actor, role, via]
                properties:
                  actor: {type: string}
                  role: {type: [string, 'null'], enum: [read, key-issuer, admin, null]}
                  via: {type: string, enum: [oidc, break_glass, shared_token]}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/orgs:
    post:
      operationId: createOrg
      requestBody: {$ref: '#/components/requestBodies/Name'}
      responses:
        '201': {description: The organization, content: {application/json: {schema: {$ref: '#/components/schemas/Org'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    get:
      operationId: listOrgs
      responses:
        '200': {description: Organizations}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/orgs/{org}/teams:
    parameters: [{$ref: '#/components/parameters/org'}]
    post:
      operationId: createTeam
      requestBody: {$ref: '#/components/requestBodies/Name'}
      responses:
        '201': {description: The team}
        '404': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    get:
      operationId: listTeams
      responses:
        '200': {description: Teams}
        '404': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/teams/{team}/budget:
    parameters: [{name: team, in: path, required: true, schema: {type: string}}]
    put:
      operationId: setTeamBudget
      description: 'The cap over every key of the team that the data plane applies as a tenant budget (data-plane note 0030). Carried in the signed snapshot only when set.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeamBudget'}
      responses:
        '200': {description: The team}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      operationId: clearTeamBudget
      responses:
        '200': {description: The team, without a budget}
        '404': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/teams/{team}/projects:
    parameters: [{name: team, in: path, required: true, schema: {type: string}}]
    post:
      operationId: createProject
      requestBody: {$ref: '#/components/requestBodies/Name'}
      responses:
        '201': {description: The project}
        '404': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    get:
      operationId: listProjects
      responses:
        '200': {description: Projects}
        '404': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/projects/{project}/keys:
    parameters: [{name: project, in: path, required: true, schema: {type: string}}]
    post:
      operationId: createKey
      description: "Creates a key. A secret key's secret is in this answer and nowhere else, ever (`Cache-Control: no-store`)."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewKey'}
      responses:
        '201': {description: 'The key and, for a secret key, its secret', content: {application/json: {schema: {$ref: '#/components/schemas/CreatedKey'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/orgs/{org}/keys:
    parameters: [{$ref: '#/components/parameters/org'}]
    get:
      operationId: listKeys
      responses:
        '200': {description: Keys}
        '404': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/keys/{key}:
    parameters: [{$ref: '#/components/parameters/key'}]
    get:
      operationId: getKey
      responses:
        '200': {description: The key, content: {application/json: {schema: {$ref: '#/components/schemas/Key'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/keys/{key}/revoke:
    parameters: [{$ref: '#/components/parameters/key'}]
    post:
      operationId: revokeKey
      description: Terminal.
      responses:
        '200': {description: The revoked key}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/keys/{key}/rotate:
    parameters: [{$ref: '#/components/parameters/key'}]
    post:
      operationId: rotateKey
      description: Creates a successor under a new name; the old key stays active until it is revoked.
      requestBody: {$ref: '#/components/requestBodies/Name'}
      responses:
        '201': {description: The successor and its secret, content: {application/json: {schema: {$ref: '#/components/schemas/CreatedKey'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/keys/{key}/limits:
    parameters: [{$ref: '#/components/parameters/key'}]
    patch:
      operationId: updateLimits
      description: A whole-limits update, not a merge - every field is named and null clears one; a field left out is a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Limits'}
      responses:
        '200': {description: The key}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/requests/{attempt}/structure:
    get:
      operationId: requestStructure
      description: |
        The prompt's structure for the cache debugger (note 0052): the segments (kind, keyed fingerprint, size; no
        text) of an attempt whose client captures structure, and how it relates to the same client's request
        before it (same provider and model, within an hour): `identical`, `appended` (it only added to the end),
        `shorter`, or `changed` with the first segment that differs. 404 `no_structure` when the client does not
        capture or the structure has aged out.
      parameters:
        - {name: attempt, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: The segments and the comparison}
        '404': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/requests/{attempt}/payload:
    get:
      operationId: requestPayload
      description: |
        A captured request and answer (note 0052, slice 5b), for a client that opted in to payload capture. Customer
        data: **admin role only**; a `payload.viewed` row is written to the change history before anything is fetched;
        the answer is `Cache-Control: no-store`. The control plane holds only an opaque reference and cannot open it:
        a gateway's admin listener does (`--gateways-file`). 404 `no_payload` (none captured), 410 `payload_expired`,
        404 `payload_gone` (no gateway has the object), 422 `payload_unreadable` (another capture key), 501
        `gateways_not_configured`, 502 `gateways_unavailable`. 403 `identity_required`: only a person signed in through
        the identity provider may open a payload, unless the operator started the server with
        `--allow-payload-views-without-sso`.
      parameters:
        - {name: attempt, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: The payload document}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '501': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /v1/requests/erase:
    post:
      operationId: eraseRequests
      description: |
        Delete the request ledger rows and stored prompt structures of a tenant, of a key, or of a key within a tenant
        (a deletion request; note 0056). **Admin only.** At least one of `tenant` and `key` is required. A key alone erases
        it in every tenant and needs `all_tenants: true` (400 `tenant_required` otherwise). `confirm` must repeat what is
        erased: the tenant, the key, or `tenant/key` (400 `confirmation_mismatch`). Records that arrive later and are no newer
        than the erasure (a gateway's retry) are refused and counted as `erased` on the usage batch. One `requests.erased`
        row is written to the change history (who, how they were identified, the selector and the counts, never what
        the rows said). Sealed payloads lose their references here, so nothing can open them; the objects on a
        gateway's store are deleted by its sweeper at their retention. The answer counts what went.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              additionalProperties: false
              properties:
                tenant: {type: string}
                key: {type: string}
                all_tenants: {type: boolean}
                confirm: {type: string}
      responses:
        '200':
          description: What was erased
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests: {type: integer}
                  structures: {type: integer}
                  payload_references: {type: integer}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/requests/{attempt}/payload/diff:
    get:
      operationId: requestPayloadDiff
      description: |
        What changed, where the cached prefix did (note 0052, slice 5c). For a request that **changed** an earlier part
        of its prompt than the same client's request before it, the segments around the first difference from both
        requests' captured prompts, side by side (`window`, each with `current` and `previous`, a `changed` flag, and
        text cut at 64 KiB with `cut: true`). Opens two payloads, so it is **admin only**, writes a `payload.viewed` row
        for each attempt before anything is fetched, and is `no-store`. A request that only grew, repeated or shortened
        its prompt (`relation` says which) opens nothing and records nothing. `unavailable` says why there is no
        window: `payload_not_captured_or_expired`, or `request_cut` (a request cut at the capture limit cannot be
        segmented). Errors as for the payload route.
      parameters:
        - {name: attempt, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: The comparison}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '501': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /v1/requests/misses:
    get:
      operationId: requestMisses
      description: |
        Where cache misses start (note 0052): every consecutive pair of one client's captured requests in the
        window (default the last 7 days), counted as identical, appended, shorter or changed, with the changed ones
        counted by the kind of the first segment that differs, in total and for the 20 clients and models with the
        most changes.
      parameters:
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, schema: {type: string, format: date-time}}
      responses:
        '200': {description: The counts}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/history:
    get:
      operationId: history
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200': {description: Newest first}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/history/verify:
    get:
      operationId: historyVerify
      description: |
        Checks the change history's hash chain (note 0047) from its first row, as `audit-verify` does.
        `{ok: true, records, unchained, head}` or `{ok: false, row, reason}` naming the first row that fails.
        Needs the admin role, and runs one at a time (a second call is a 429): it reads the whole history under the
        store's lock. The head hash is what to keep where the database's writer cannot reach: a removed last row is
        invisible to the chain alone.
      responses:
        '200': {description: The result of the check}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/gateways:
    get:
      operationId: gateways
      description: |
        The status of each gateway listed in `--gateways-file` (design note 0051), read from its admin
        listener: `/v1/gateway/stats` (providers and their circuits, deployments, named routes, queues),
        `/v1/serve/config` (the configuration in force, reload state, snapshot) and `/ready`. One answer is shared
        for five seconds. A gateway that cannot be read has `reachable: false` or an `error` code
        (`unreachable`, `unauthorized`, `bad_response`, `token_unreadable`), never the gateway's own text. With
        no gateways file: `{configured: false, gateways: []}`.
      responses:
        '200': {description: The gateways' status}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/usage/batch:
    post:
      operationId: ingestUsage
      description: |
        The gateways' usage push (design note 0051). Takes **only** the ingest token
        (`--ingest-token-file`): no person's token, role or the shared token is accepted here, and the
        ingest token is accepted nowhere else. With no ingest token configured every call is a 401, as for a wrong one.
        Records are the gateway's usage log lines; unknown fields are ignored, a malformed record is
        counted as rejected and not stored, and an attempt id that is already stored is a duplicate
        (delivery is at least once, storage exactly once).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              additionalProperties: false
              properties:
                records: {type: array, maxItems: 500, items: {type: object}}
      responses:
        '200':
          description: What was done
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicate, rejected]
                properties:
                  accepted: {type: integer}
                  duplicate: {type: integer}
                  rejected: {type: integer}
                  erased: {type: integer, description: Records refused because their tenant or key was erased after they were made (note 0056); not stored.}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/requests:
    get:
      operationId: listRequests
      description: One row per provider attempt, newest first, keyset-paged. Metadata only.
      parameters:
        - {name: from, in: query, required: false, description: RFC 3339, inclusive, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, description: RFC 3339, exclusive, schema: {type: string, format: date-time}}
        - {name: tenant, in: query, required: false, schema: {type: string, maxLength: 256}}
        - {name: key, in: query, required: false, description: The caller key's name, schema: {type: string, maxLength: 256}}
        - {name: model, in: query, required: false, schema: {type: string, maxLength: 256}}
        - {name: provider, in: query, required: false, schema: {type: string, maxLength: 256}}
        - {name: outcome, in: query, required: false, schema: {type: string, enum: [completed, http_failure, transport_failure, invalid_response, stream_failure, abandoned]}}
        - {name: request_id, in: query, required: false, schema: {type: string, maxLength: 256}}
        - {name: min_cost_usd, in: query, required: false, schema: {type: number, minimum: 0}}
        - {name: cursor, in: query, required: false, description: The previous page's next_cursor, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200':
          description: A page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/requests/summary:
    get:
      operationId: requestsSummary
      description: |
        Totals over the filtered rows and, with group_by, a breakdown (at most 500 groups). A cost that
        is unknown is counted in cost_unknown_attempts and never added as zero; cost_estimated_attempts
        counts attempts priced from a list or a lower bound rather than the provider's bill.
      parameters:
        - {name: from, in: query, required: false, description: RFC 3339, inclusive, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, description: RFC 3339, exclusive, schema: {type: string, format: date-time}}
        - {name: tenant, in: query, required: false, schema: {type: string, maxLength: 256}}
        - {name: key, in: query, required: false, description: The caller key's name, schema: {type: string, maxLength: 256}}
        - {name: model, in: query, required: false, schema: {type: string, maxLength: 256}}
        - {name: provider, in: query, required: false, schema: {type: string, maxLength: 256}}
        - {name: outcome, in: query, required: false, schema: {type: string, enum: [completed, http_failure, transport_failure, invalid_response, stream_failure, abandoned]}}
        - {name: request_id, in: query, required: false, schema: {type: string, maxLength: 256}}
        - {name: min_cost_usd, in: query, required: false, schema: {type: number, minimum: 0}}
        - {name: group_by, in: query, required: false, schema: {type: string, enum: [hour, day, tenant, key, model, provider]}}
      responses:
        '200': {description: The summary}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/requests/facets:
    get:
      operationId: requestsFacets
      description: The distinct tenants, keys, models and providers in the ledger (at most 500 each), for filter lists.
      parameters:
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
      responses:
        '200': {description: The values}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/orgs/{org}/snapshots:
    parameters: [{$ref: '#/components/parameters/org'}]
    post:
      operationId: publishSnapshot
      description: Builds, signs and stores the next generation. 503 without a signing key file.
      responses:
        '201': {description: The generation}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/orgs/{org}/snapshot:
    parameters: [{$ref: '#/components/parameters/org'}]
    get:
      operationId: latestSnapshot
      description: The latest signed envelope, as a data plane's `snapshot_file` holds it. ETag is the generation. It carries the SHA-256 of each secret key's secret (the data plane's input), the only place a hash is served.
      responses:
        '200': {description: The signed envelope}
        '304': {description: Not modified}
        '404': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  parameters:
    org: {name: org, in: path, required: true, schema: {type: string}}
    key: {name: key, in: path, required: true, schema: {type: string}}
  requestBodies:
    Name:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            additionalProperties: false
            properties: {name: {type: string}}
  responses:
    Error:
      description: An error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: The caller is authenticated but its role does not allow this (single sign-on only)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: The identity provider's keys cannot be fetched (single sign-on only)
      headers:
        Retry-After: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing or wrong token
      headers:
        WWW-Authenticate: {schema: {type: string, const: Bearer}}
  schemas:
    RequestPage:
      type: object
      required: [requests]
      properties:
        next_cursor: {type: [string, 'null']}
        requests:
          type: array
          items:
            type: object
            required: [attempt_id, ts, provider, model, outcome, duration_ms, input_tokens, output_tokens]
            properties:
              attempt_id: {type: string}
              ts: {type: string, format: date-time}
              tenant: {type: [string, 'null']}
              key: {type: [string, 'null']}
              request_id: {type: [string, 'null']}
              deployment: {type: [string, 'null']}
              provider: {type: string}
              model: {type: string}
              kind: {type: string, enum: [completion, stream]}
              outcome: {type: string}
              http_status: {type: [integer, 'null']}
              duration_ms: {type: integer}
              input_tokens: {type: integer}
              output_tokens: {type: integer}
              reasoning_tokens: {type: [integer, 'null']}
              uncached_input_tokens: {type: [integer, 'null']}
              cache_read_tokens: {type: integer}
              cache_write_tokens: {type: integer}
              cache_hit_pct: {type: [number, 'null'], description: Cache reads as a share of the whole prompt; null when the uncached part was not reported}
              cost_usd: {type: [number, 'null'], description: null means unknown, never free}
              cost_source: {type: [string, 'null'], enum: [provider, provider_floor, catalog, null]}
              usage_reported: {type: boolean}
              admission: {type: string}
              tags: {type: [object, 'null']}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, enum: [invalid_request, not_found, conflict, internal, signing_key_unconfigured, no_such_route]}
            message: {type: string}
    Org:
      type: object
      required: [id, name, created_at]
      properties: {id: {type: string}, name: {type: string}, created_at: {type: string}}
    Key:
      type: object
      description: A key. Its secret and its hash are never in it (a published snapshot, below, carries hashes by design).
      required: [id, org_id, project_id, team_id, name, kind, state, tier, budget_allow_unpriced, created_at]
      properties:
        id: {type: string}
        org_id: {type: string}
        project_id: {type: string}
        team_id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [secret, client_san, jwt]}
        state: {type: string, enum: [active, revoked]}
        client_san: {type: [string, 'null']}
        jwt_table: {type: [string, 'null']}
        jwt_subject: {type: [string, 'null']}
        expires_at: {type: [string, 'null']}
        tier: {type: integer}
        rpm: {type: [integer, 'null']}
        tpm: {type: [integer, 'null']}
        budget_usd: {type: [number, 'null']}
        budget_window_secs: {type: [integer, 'null']}
        budget_allow_unpriced: {type: boolean}
        allowed_cidrs: {type: [array, 'null'], items: {type: string}}
        allowed_models: {type: [array, 'null'], items: {type: string}}
        tags: {type: object, additionalProperties: {type: string}}
        created_at: {type: string}
        revoked_at: {type: [string, 'null']}
    CreatedKey:
      type: object
      required: [key, secret]
      properties:
        key: {$ref: '#/components/schemas/Key'}
        secret: {type: [string, 'null'], description: Shown once; null for a certificate or token identity}
    TeamBudget:
      type: object
      required: [budget_usd]
      additionalProperties: false
      properties:
        budget_usd: {type: number}
        budget_window_secs: {type: integer}
        budget_allow_unpriced: {type: boolean}
    NewKey:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string}
        credential:
          oneOf:
            - {type: object, required: [type], additionalProperties: false, properties: {type: {const: secret}}}
            - {type: object, required: [type, san], additionalProperties: false, properties: {type: {const: client_san}, san: {type: string}}}
            - {type: object, required: [type, table, subject], additionalProperties: false, properties: {type: {const: jwt}, table: {type: string}, subject: {type: string}}}
        tier: {type: integer, minimum: 0, maximum: 255}
        rpm: {type: integer, minimum: 0}
        tpm: {type: integer, minimum: 0}
        budget_usd: {type: number}
        budget_window_secs: {type: integer}
        budget_allow_unpriced: {type: boolean}
        allowed_cidrs: {type: array, items: {type: string}}
        allowed_models: {type: array, items: {type: string}, description: 'provider/model, prefix/* or route/<name> (data-plane note 0028); set at creation and copied on rotation'}
        tags: {type: object, additionalProperties: {type: string}, description: 'Labels copied onto the key''s usage records (data-plane note 0029): at most 16, names a-z0-9_ starting with a letter (32), values 1 to 64 printable ASCII; set at creation and copied on rotation'}
        expires_at: {type: string, format: date-time}
    Limits:
      type: object
      description: Every field is named; null clears one. A body that leaves one out is a 400.
      additionalProperties: false
      required: [rpm, tpm, budget_usd, budget_window_secs, expires_at]
      properties:
        rpm: {type: [integer, 'null'], minimum: 0}
        tpm: {type: [integer, 'null'], minimum: 0}
        budget_usd: {type: [number, 'null']}
        budget_window_secs: {type: [integer, 'null']}
        expires_at: {type: [string, 'null'], format: date-time}
