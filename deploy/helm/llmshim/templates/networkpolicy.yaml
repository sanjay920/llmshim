{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "llmshim.fullname" . }}
  labels:
    {{- include "llmshim.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "llmshim.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    {{- with .Values.networkPolicy.gatewayFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: gateway
    {{- end }}
    {{- with .Values.networkPolicy.adminFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: admin
    {{- end }}
{{- end }}
