apiVersion: v1
kind: Service
metadata:
  name: {{ include "llmshim.fullname" . }}
  labels:
    {{- include "llmshim.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: gateway
      port: {{ .Values.service.port }}
      targetPort: gateway
  selector:
    {{- include "llmshim.selectorLabels" . | nindent 4 }}
---
# Headless, for a scraper that addresses pods individually. The admin port is
# deliberately not on the ClusterIP service above.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llmshim.fullname" . }}-admin
  labels:
    {{- include "llmshim.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: admin
      port: {{ .Values.admin.port }}
      targetPort: admin
  selector:
    {{- include "llmshim.selectorLabels" . | nindent 4 }}
