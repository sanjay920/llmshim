# Google Cloud Storage with a service-account key file from a Secret (off GKE, or where Workload Identity is not available).
# Used by deploy/helm/validate.sh (rendered, schema-checked and fed through `llmshim serve --check`) and
# as a worked example for this platform: copy it and change the names.
replicaCount: 3
existingSecret: llmshim-secrets
fleet:
  enabled: true
mediaStore:
  enabled: true
  kind: gcs
  gcs:
    bucket: llmshim-media
    credentials: service-account
    serviceAccountSecret: llmshim-gcs-key     # a Secret with the key file under the key below
    serviceAccountKey: key.json
config: |
  [providers.openai]
  kind = "openai"
  api_key = { env = "OPENAI_API_KEY" }

  [[keys]]
  name = "media-example"
  tenant = "media"
  secret = { env = "EXAMPLE_GATEWAY_KEY" }
