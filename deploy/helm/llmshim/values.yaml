# llmshim enterprise gateway (`llmshim serve`). In development: it follows the
# unstable `serve` feature and its configuration contract, and may change.

replicaCount: 2

image:
  # No public image is published yet. Build one with
  #   docker build --build-arg FEATURES=serve-redis -t <registry>/llmshim:<tag> .
  # (serve-redis includes fleet mode; use FEATURES=serve for a single instance.)
  repository: llmshim
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Environment variables for every secret the configuration refers to, taken
# from one Secret you create. Its keys are exported under their own names, and
# the configuration names them: provider keys (`api_key = { env = "..." }`),
# caller keys, the admin token and the Redis URL. The chart never creates it.
existingSecret: ""
# The pods read the Secret above as environment variables, so a changed Secret
# changes nothing in the pod spec and the pods keep the values they started with
# (a pod that restarts later then differs from its peers). Change this string
# whenever you change a value in the Secret, to roll the pods onto it.
secretRevision: ""

server:
  port: 3000
  # Terminate TLS in the pod from a kubernetes.io/tls Secret (tls.crt, tls.key).
  # A renewed Secret is picked up without a restart; the kubelet refreshes the
  # mounted files and the server reloads them.
  tls:
    enabled: false
    secretName: ""
    reloadIntervalSecs: 30
    # Require a client certificate on every connection, signed by the CA in the
    # Secret's ca.crt (cert-manager puts it there). Workloads then authenticate
    # with `client_san` keys in `config`. Needs tls.enabled.
    requireClientCertificate: false

admin:
  # /metrics, /v1/gateway/stats, /health and /ready on their own port. Probes
  # use it. The kubelet reaches it over the pod network, so it binds all
  # interfaces; restrict it with the NetworkPolicy below or the service mesh.
  port: 9090
  # Name of the environment variable (from existingSecret) holding the bearer
  # token that /metrics and stats require. The Secret must contain it, or the
  # pod refuses to start. To serve those endpoints with no token, which leaves
  # them open to anything that can reach the port, set tokenEnv to "" and
  # allowUnauthenticated to true; the render fails if neither is set.
  tokenEnv: GATEWAY_ADMIN_TOKEN
  allowUnauthenticated: false

fleet:
  # Share the queue, limits, spend ledger and provider health between replicas
  # through Redis. Needs an image built with FEATURES=serve-redis.
  enabled: false
  redisUrlEnv: REDIS_URL   # name of the variable in existingSecret

logging:
  # "stdout" writes one JSON access line per request for the platform to
  # collect (tenant, status, latency, request id, credential fingerprint).
  # Empty turns it off.
  accessLog: ""
  # "stdout" also writes one usage line per provider attempt: tenant, model,
  # tokens and USD cost, for showback and chargeback. Empty turns it off.
  usageLog: ""

# The object store a fleet's images, speech and transcription routes carry their megabytes
# through (note 0050). Needs fleet.enabled: a single instance keeps them in memory and would
# ignore the store, so the render refuses the combination. Every object is sealed (AES-256-GCM)
# before it is stored, so the store holds ciphertext only. Pick the kind your platform has:
#
#   file        a ReadWriteMany volume every replica mounts (EFS, Filestore, Azure Files, NFS, CephFS)
#   s3          any S3-compatible service: AWS S3, MinIO or Ceph in the cluster, R2, Spaces, B2.
#               credentials: aws    the pod's own role (EKS IRSA / Pod Identity, ECS, EC2): no key stored
#               credentials: keys   an access key from existingSecret
#   gcs         Google Cloud Storage. credentials: metadata (GKE Workload Identity), service-account
#               (a key file from a Secret) or none (an emulator)
#   azure-blob  Azure Blob Storage. credentials: workload-identity (AKS), managed-identity, sas or
#               account-key
#
# Examples for each platform are in ci/. Give the bucket or container a lifecycle rule that expires the
# prefix after a day as a backstop: the gateway deletes what it stages and sweeps orphans itself.
mediaStore:
  enabled: false
  kind: ""             # file | s3 | gcs | azure-blob
  prefix: ""           # a key prefix (s3, gcs, azure-blob), ending in "/": share a bucket safely
  # PEM certificates to trust for the store's endpoint instead of the web PKI roots (a private CA, an
  # in-cluster MinIO with its own certificate): the path of a file you mount with extraVolumes.
  caFile: ""
  maxObjectBytes: 0    # 0 = the gateway's default (64 MiB), up to 268435456
  ttlSecs: 0           # 0 = the default (3600): an object older than this is an orphan the sweeper deletes
  file:
    # An existing ReadWriteMany claim, mounted at /var/lib/llmshim/media in every replica. Objects are
    # owner-only, so every replica must run as the same user, and that user (uid 65532) must be able to
    # WRITE the volume: Kubernetes applies fsGroup to block and many CSI volumes but NOT to NFS-style
    # ones (Filestore, generic NFS, CephFS, EFS without an access point), which are often root-owned
    # 0755. Use an EFS access point owned by 65532, or chown the export once; the gateway checks that
    # the directory is writable at start and refuses to start if it is not.
    claimName: ""
    # Or have the chart create the claim.
    persistence:
      create: false
      storageClassName: ""
      size: 10Gi
  s3:
    bucket: ""
    region: ""
    endpoint: ""            # omit for AWS S3; for MinIO, e.g. https://minio.minio.svc:9000
    pathStyle: ""           # true or false (a boolean or a string); empty = true with an endpoint, false without
    allowInsecureHttp: false
    credentials: keys       # keys | aws
    # With credentials: keys: the NAMES of variables in existingSecret.
    accessKeyIdEnv: MEDIA_S3_ACCESS_KEY_ID
    secretAccessKeyEnv: MEDIA_S3_SECRET_ACCESS_KEY
    sessionTokenEnv: ""
    # With credentials: aws (a build with serve-cloud), annotate the service account:
    #   serviceAccount.annotations: {eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/llmshim-media}
  gcs:
    bucket: ""
    credentials: metadata   # metadata | service-account | none
    endpoint: ""            # an emulator or a private endpoint (required with none)
    metadataEndpoint: ""    # a non-standard metadata server (credentials: metadata)
    allowInsecureHttp: false
    # With credentials: metadata on GKE, annotate the service account:
    #   serviceAccount.annotations: {iam.gke.io/gcp-service-account: llmshim-media@PROJECT.iam.gserviceaccount.com}
    # With credentials: service-account: a Secret holding the key file, mounted read-only at
    # /etc/llmshim-gcp (not under /etc/llmshim, which is itself a read-only mount).
    serviceAccountSecret: ""
    serviceAccountKey: key.json
  azureBlob:
    account: ""
    container: ""
    credentials: workload-identity   # workload-identity | managed-identity | sas | account-key
    endpoint: ""                     # an emulator, a sovereign cloud or a private endpoint
    allowInsecureHttp: false
    # workload-identity (AKS): the chart labels the pods azure.workload.identity/use and the webhook
    # projects the token; annotate the service account with the identity's client id:
    #   serviceAccount.annotations: {azure.workload.identity/client-id: <client id>}
    tenantId: ""
    clientId: ""                     # also selects a user-assigned managed identity
    federatedTokenFile: /var/run/secrets/azure/tokens/azure-identity-token
    authorityHost: ""                # a sovereign cloud's Entra authority, https
    identityEndpoint: ""             # managed-identity: a non-standard instance metadata service
    # sas / account-key: the NAMES of variables in existingSecret.
    sasEnv: MEDIA_AZURE_SAS_TOKEN
    accountKeyEnv: MEDIA_AZURE_ACCOUNT_KEY

# More volumes and mounts for the pod: a private CA for an object store's endpoint, a key file.
extraVolumes: []
extraVolumeMounts: []

state:
  # Replay receipts. emptyDir loses them on rescheduling; a client that replays
  # through another replica then gets an error. Use a ReadWriteMany claim, or
  # sticky routing, if clients depend on receipts.
  receiptsClaimName: ""
  idempotencyTtlSecs: 300

# The rest of the gateway configuration, in TOML, appended after the sections
# the chart writes from the values above ([server], [admin], [fleet], [state]).
# Providers, caller keys, limits and routes go here. See
# docs/design/enterprise-gateway/example.toml for every setting.
config: |
  [providers.openai]
  kind = "openai"
  api_key = { env = "OPENAI_API_KEY" }

  [[keys]]
  name = "example"
  tenant = "example"
  secret = { env = "EXAMPLE_GATEWAY_KEY" }

service:
  type: ClusterIP
  port: 80
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

# Not rendered with a single replica (replicaCount, or autoscaling.minReplicas
# when autoscaling is on), because minAvailable: 1 would then block every node
# drain.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Allow traffic to the gateway port from `gatewayFrom` and to the admin port
# only from `adminFrom` (for example your monitoring namespace). Both are lists
# of NetworkPolicyPeer; an empty list allows nothing extra, so enabling the
# policy without them denies all ingress.
networkPolicy:
  enabled: false
  gatewayFrom: []        # list of NetworkPolicyPeer
  adminFrom: []          # list of NetworkPolicyPeer

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
terminationGracePeriodSeconds: 60
